name: Update and validate catalogs
on:
  push:
    branches: [main]
    paths: ['catalogs/**', 'index.json', 'tools/**', '.github/workflows/validate.yml']
  pull_request:
permissions:
  contents: read
jobs:
  update:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate and validate index
        env:
          CATALOG_REPOSITORY: ${{ github.repository }}
          CATALOG_PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [ "$CATALOG_PRIVATE" = "true" ]; then
            CATALOG_BASE="https://api.github.com/repos/$CATALOG_REPOSITORY/contents"
          else
            CATALOG_BASE="https://raw.githubusercontent.com/$CATALOG_REPOSITORY/main"
          fi
          python3 tools/build_index.py --base-url "$CATALOG_BASE"
          python3 tools/validate_index.py
      - name: Commit index update
        run: |
          if ! git diff --quiet -- index.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.json
            git commit -m 'Update catalog index'
            git push
          fi
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/validate_index.py
